<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Cut Report Manual Preview</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 0; background: #f4f4f5; color: #18181b; }
    main { max-width: 680px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 24px; margin: 8px 0 4px; }
    p { color: #52525b; line-height: 1.45; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: block; font-weight: 650; font-size: 14px; margin: 10px 0 4px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #d4d4d8; border-radius: 12px; font-size: 16px; background: white; }
    textarea { min-height: 76px; resize: vertical; }
    button { width: 100%; margin-top: 14px; border: 0; border-radius: 14px; padding: 14px; font-weight: 750; font-size: 16px; background: #18181b; color: white; }
    .card { margin-top: 18px; background: white; border-radius: 22px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    .report-title { font-size: 21px; font-weight: 850; }
    .muted { color: #71717a; }
    .metric { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e4e4e7; }
    .metric:last-child { border-bottom: 0; }
    .value { font-weight: 800; }
    .verdict { margin-top: 12px; padding: 12px; border-radius: 14px; background: #f4f4f5; font-weight: 750; }
    canvas { display: none; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Daily Cut Report — Manual Preview</h1>
  <p>This works offline in your browser and exports a PNG. It does not read Health Connect; the native Android APK is needed for that.</p>

  <div class="grid">
    <div><label>Date</label><input id="date" type="date"></div>
    <div><label>Steps</label><input id="steps" inputmode="numeric" value="0"></div>
    <div><label>Final burn kcal</label><input id="burn" inputmode="decimal" value="2000"></div>
    <div><label>Food kcal</label><input id="food" inputmode="decimal" value="0"></div>
    <div><label>Protein g</label><input id="protein" inputmode="decimal" value="0"></div>
    <div><label>Sodium mg</label><input id="sodium" inputmode="decimal" value="0"></div>
  </div>
  <label>Notes</label><textarea id="notes" placeholder="Example: good protein, sodium acceptable"></textarea>

  <button onclick="render()">Update report</button>
  <button onclick="downloadPng()">Export PNG</button>

  <section class="card" id="report"></section>
  <canvas id="canvas" width="1080" height="1350"></canvas>
</main>
<script>
  const ids = ["date","steps","burn","food","protein","sodium","notes"];
  const today = new Date();
  document.getElementById("date").value = today.toISOString().slice(0,10);
  for (const id of ids) {
    const el = document.getElementById(id);
    const saved = localStorage.getItem("dcr_" + id);
    if (saved !== null) el.value = saved;
    el.addEventListener("input", () => { localStorage.setItem("dcr_" + id, el.value); render(); });
  }
  const n = id => Number(String(document.getElementById(id).value).replace(/,/g,"")) || 0;
  const fmt = x => Math.round(x).toLocaleString();
  function calc() {
    const burn = n("burn"), food = n("food"), deficit = burn - food;
    let verdict = "Maintenance-ish";
    if (deficit >= 300) verdict = "Cutting day";
    if (deficit <= -150) verdict = "Surplus day";
    return { date: document.getElementById("date").value, steps: n("steps"), burn, food, protein: n("protein"), sodium: n("sodium"), notes: document.getElementById("notes").value.trim(), deficit, verdict };
  }
  function render() {
    const d = calc();
    document.getElementById("report").innerHTML = `
      <div class="report-title">${d.date} — Daily Fitness Report</div>
      <div class="muted">Manual offline preview</div>
      <div class="metric"><span>Steps</span><span class="value">${fmt(d.steps)}</span></div>
      <div class="metric"><span>Final burn</span><span class="value">${fmt(d.burn)} kcal</span></div>
      <div class="metric"><span>Food</span><span class="value">${fmt(d.food)} kcal</span></div>
      <div class="metric"><span>Protein</span><span class="value">${fmt(d.protein)} g</span></div>
      <div class="metric"><span>Sodium</span><span class="value">${fmt(d.sodium)} mg</span></div>
      <div class="metric"><span>Estimated deficit</span><span class="value">${fmt(d.deficit)} kcal</span></div>
      <div class="verdict">${d.verdict}${d.notes ? " — " + d.notes : ""}</div>`;
  }
  function roundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawLine(ctx, label, value, y) {
    ctx.fillStyle = "#18181b"; ctx.font = "42px system-ui, sans-serif"; ctx.fillText(label, 95, y);
    ctx.font = "700 42px system-ui, sans-serif"; ctx.textAlign = "right"; ctx.fillText(value, 985, y); ctx.textAlign = "left";
    ctx.strokeStyle = "#e4e4e7"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(95, y+30); ctx.lineTo(985, y+30); ctx.stroke();
  }
  function downloadPng() {
    const d = calc(), c = document.getElementById("canvas"), ctx = c.getContext("2d");
    ctx.fillStyle = "#f4f4f5"; ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle = "#ffffff"; roundedRect(ctx, 55, 70, 970, 1120, 42); ctx.fill();
    ctx.fillStyle = "#18181b"; ctx.font = "800 58px system-ui, sans-serif"; ctx.fillText("Daily Fitness Report", 95, 160);
    ctx.fillStyle = "#71717a"; ctx.font = "36px system-ui, sans-serif"; ctx.fillText(d.date + " • offline export", 95, 220);
    drawLine(ctx, "Steps", fmt(d.steps), 330);
    drawLine(ctx, "Final burn", fmt(d.burn) + " kcal", 440);
    drawLine(ctx, "Food", fmt(d.food) + " kcal", 550);
    drawLine(ctx, "Protein", fmt(d.protein) + " g", 660);
    drawLine(ctx, "Sodium", fmt(d.sodium) + " mg", 770);
    drawLine(ctx, "Estimated deficit", fmt(d.deficit) + " kcal", 880);
    ctx.fillStyle = "#f4f4f5"; roundedRect(ctx, 95, 960, 890, 140, 28); ctx.fill();
    ctx.fillStyle = "#18181b"; ctx.font = "700 40px system-ui, sans-serif"; ctx.fillText(d.verdict, 125, 1020);
    ctx.font = "32px system-ui, sans-serif"; ctx.fillStyle = "#52525b";
    const note = d.notes || "No notes."; ctx.fillText(note.slice(0, 46), 125, 1075);
    const a = document.createElement("a");
    a.download = `DailyCutReport_${d.date || "today"}.png`;
    a.href = c.toDataURL("image/png");
    a.click();
  }
  render();
</script>
</body>
</html>
