name: Build signed release APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing keys
        env:
          RELEASE_KEYSTORE: ${{ secrets.DCR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE"
          mkdir -p "$RUNNER_TEMP/dailycut-signing"
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/dailycut-signing/release.p12"
          base64 -d app/signing/dailycut-debug.jks.b64 > app/signing/dailycut-debug.jks

      - name: Test and lint
        run: |
          node scripts/validate-landing-page.mjs
          node --test tablet-preview/model.test.js
          gradle --no-daemon testDebugUnitTest lintDebug

      - name: Build universal release
        env:
          DCR_RELEASE_STORE_FILE: ${{ runner.temp }}/dailycut-signing/release.p12
          DCR_RELEASE_STORE_PASSWORD: ${{ secrets.DCR_RELEASE_STORE_PASSWORD }}
          DCR_RELEASE_KEY_ALIAS: ${{ secrets.DCR_RELEASE_KEY_ALIAS }}
          DCR_RELEASE_KEY_PASSWORD: ${{ secrets.DCR_RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon verifyOfflineReleaseApk
          mkdir -p release-assets
          version=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          echo "DCR_VERSION=$version" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/DailyCutReport-${version}-universal.apk"

      - name: Build arm64 release
        env:
          DCR_RELEASE_STORE_FILE: ${{ runner.temp }}/dailycut-signing/release.p12
          DCR_RELEASE_STORE_PASSWORD: ${{ secrets.DCR_RELEASE_STORE_PASSWORD }}
          DCR_RELEASE_KEY_ALIAS: ${{ secrets.DCR_RELEASE_KEY_ALIAS }}
          DCR_RELEASE_KEY_PASSWORD: ${{ secrets.DCR_RELEASE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean verifyOfflineReleaseApk -PdcrAbi=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk "release-assets/DailyCutReport-${DCR_VERSION}-arm64.apk"

      - name: Verify signatures, ABIs, and size gates
        run: |
          universal="release-assets/DailyCutReport-${DCR_VERSION}-universal.apk"
          arm64="release-assets/DailyCutReport-${DCR_VERSION}-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$universal"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$arm64"
          test "$(stat -c%s "$universal")" -le $((80 * 1024 * 1024))
          test "$(stat -c%s "$arm64")" -le $((35 * 1024 * 1024))
          unzip -Z1 "$arm64" | grep '^lib/arm64-v8a/' >/dev/null
          ! unzip -Z1 "$arm64" | grep -E '^lib/(armeabi-v7a|x86|x86_64)/'
          sha256sum "$arm64" "$universal" > release-assets/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DailyCutReport-${{ env.DCR_VERSION }}-signed
          path: release-assets/*
          if-no-files-found: error

      - name: Attach tagged prerelease assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release-assets/*

  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore debug signing key
        run: base64 -d app/signing/dailycut-debug.jks.b64 > app/signing/dailycut-debug.jks
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Run emulator instrumentation and OCR tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: gradle --no-daemon connectedDebugAndroidTest
