name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key
        run: |
          base64 -d app/signing/dailycut-debug.jks.b64 > app/signing/dailycut-debug.jks
          keytool -list -keystore app/signing/dailycut-debug.jks -storepass dailycutdebug -alias dailycut

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test browser preview model
        run: node tablet-preview/model.test.js

      - name: Test Android logic and migrations
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon lintDebug

      - name: Build and verify strict offline APK
        run: gradle --no-daemon verifyOfflineDebugApk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyCutReport-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
